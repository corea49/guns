<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>건스패밀리 - 난이도 상승 버젼</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0c20;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>

<div id="game-container"></div>

<script>
/**
 * 건스패밀리 (Guns Family) - 단계별 속도 증가 및 다양화된 패턴 적용 버전
 */

const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 1500 },
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

// 전역 변수
let selectedHero = null;
let player;
let groundTile;
let obstacles;
let coins;
let hearts;

// 이펙트 및 스킬 상태
let shieldGraphics;
let skillTimer = null;
let warningTimer = null;

let score = 0;
let coinCount = 0;
let playerHP = 100;
let maxHP = 100;
let isGameRunning = false;
let jumpCount = 0;
let isSliding = false;
let skillGauge = 0;
let isSkillActive = false;
let isSkillEndingSoon = false;

// ⏱️ 단계(Phase) & 속도 시스템 변수
let gamePhase = 1;
let baseGameSpeed = 7;
let currentSpeed = 7;
let gameTimer = 0; // 초 단위 타이머
let spawnTimerEvent = null;
let spawnInterval = 1400; // 초기 장애물 생성 간격(ms)

// UI
let jumpBtn, slideBtn, skillBtn, skillText;
let hpBarFill, skillBarFill, scoreText, phaseText;
let selectScreenContainer;

function preload() {}

function create() {
    const scene = this;

    // 초기 상태 리셋
    gamePhase = 1;
    baseGameSpeed = 7;
    spawnInterval = 1400;
    gameTimer = 0;

    createBlockTextures(scene);

    scene.bgFar = scene.add.tileSprite(0, 0, scene.scale.width, scene.scale.height, 'bgLayer').setOrigin(0, 0);

    let groundY = scene.scale.height - 80;
    groundTile = scene.add.tileSprite(0, groundY, scene.scale.width * 2, 160, 'groundBlock').setOrigin(0, 0);
    scene.physics.add.existing(groundTile, true);

    obstacles = scene.physics.add.group();
    coins = scene.physics.add.group();
    hearts = scene.physics.add.group();

    shieldGraphics = scene.add.graphics().setDepth(20);

    createInGameUI(scene);
    createCharacterSelectScreen(scene);

    scene.cursors = scene.input.keyboard.createCursorKeys();
    scene.spaceKey = scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);

    // 1초 단위 타이머 (단계 및 속도 계산용)
    scene.time.addEvent({
        delay: 1000,
        callback: () => {
            if (isGameRunning) {
                gameTimer++;
                // 30초마다 단계 상승
                let newPhase = Math.floor(gameTimer / 30) + 1;
                if (newPhase !== gamePhase) {
                    levelUpPhase(scene, newPhase);
                }
            }
        },
        loop: true
    });

    scene.scale.on('resize', (gameSize) => {
        scene.bgFar.setSize(gameSize.width, gameSize.height);
        repositionUI(scene, gameSize);
    });
}

function update() {
    if (!isGameRunning) return;

    // 영웅 스킬 활성화 시 추가속도 +1.3배
    currentSpeed = isSkillActive ? baseGameSpeed * 1.3 : baseGameSpeed;

    this.bgFar.tilePositionX += currentSpeed * 0.3;
    groundTile.tilePositionX += currentSpeed;

    // 장애물 및 아이템 이동
    obstacles.children.iterate((obs) => {
        if (obs) {
            obs.x -= currentSpeed;
            if (obs.x < -150) obs.destroy();
        }
    });

    coins.children.iterate((coin) => {
        if (coin) {
            if (isSkillActive && selectedHero === 'GUNYOUNG') {
                this.physics.moveToObject(coin, player, 700);
            } else {
                coin.x -= currentSpeed;
            }
            if (coin.x < -50) coin.destroy();
        }
    });

    hearts.children.iterate((h) => {
        if (h) {
            h.x -= currentSpeed;
            if (h.x < -50) h.destroy();
        }
    });

    // 키보드 조작
    if (Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
        handleJump(this);
    }
    if (this.cursors.down.isDown) {
        if (!isSliding) handleSlide(this, true);
    } else {
        if (isSliding) handleSlide(this, false);
    }

    updateShieldEffect(this);
    updateUI();
}

// 🚀 30초마다 단계 상승 처리
function levelUpPhase(scene, newPhase) {
    gamePhase = newPhase;
    // 단계당 속도 1.2씩 증가 (기본 7 -> 8.2 -> 9.4 -> 10.6...)
    baseGameSpeed = 7 + (gamePhase - 1) * 1.2;
    
    // 장애물 출현 속도도 약간씩 빨라짐 (최소 800ms)
    spawnInterval = Math.max(800, 1400 - (gamePhase - 1) * 100);

    // 패턴 타이머 재설정
    if (spawnTimerEvent) spawnTimerEvent.remove();
    spawnTimerEvent = scene.time.addEvent({
        delay: spawnInterval,
        callback: () => { if (isGameRunning) spawnPattern(scene); },
        loop: true
    });

    // 화면 연출
    scene.cameras.main.flash(400, 241, 196, 15);
    scene.cameras.main.shake(300, 0.01);

    let lvlText = scene.add.text(scene.scale.width / 2, scene.scale.height / 2 - 50, `PHASE ${gamePhase} SPEED UP!`, {
        fontSize: '42px', color: '#f1c40f', style: 'bold', stroke: '#000', strokeThickness: 6
    }).setOrigin(0.5).setDepth(150);

    scene.tweens.add({
        targets: lvlText,
        y: scene.scale.height / 2 - 100,
        alpha: 0,
        duration: 1500,
        onComplete: () => lvlText.destroy()
    });
}

// --- 그래픽 생성 ---
function createBlockTextures(scene) {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });

    g.fillStyle(0x1a1c2e); g.fillRect(0, 0, 64, 64);
    g.fillStyle(0x2d3142); g.fillCircle(32, 32, 4);
    g.generateTexture('bgLayer', 64, 64);

    g.clear();
    g.fillStyle(0x34495e); g.fillRect(0, 0, 64, 64);
    g.fillStyle(0x2c3e50); g.fillRect(0, 0, 64, 12);
    g.generateTexture('groundBlock', 64, 64);

    // 1. 건영 (서있기: 48x64)
    g.clear();
    g.fillStyle(0x2c2c54); g.fillRect(6, 6, 36, 52); 
    g.fillStyle(0xa55eea); g.fillRect(10, 10, 28, 6);  
    g.fillStyle(0x00d2d3); g.fillRect(12, 18, 6, 4); g.fillRect(28, 18, 6, 4); 
    g.generateTexture('heroGunyoung', 48, 64);

    // 1-1. 건영 (숙이기: 56x32)
    g.clear();
    g.fillStyle(0x2c2c54); g.fillRect(4, 8, 48, 24); 
    g.fillStyle(0xa55eea); g.fillRect(8, 12, 16, 16);  
    g.fillStyle(0x00d2d3); g.fillRect(32, 14, 6, 4); g.fillRect(40, 14, 6, 4); 
    g.generateTexture('heroGunyoungSlide', 56, 32);

    // 2. 건우 (서있기: 48x64)
    g.clear();
    g.fillStyle(0x26de81); g.fillRect(4, 4, 40, 56); 
    g.fillStyle(0x8854d0); g.fillRect(4, 38, 40, 22); 
    g.fillStyle(0xff4757); g.fillRect(10, 14, 8, 6); g.fillRect(30, 14, 8, 6); 
    g.generateTexture('heroGunwoo', 48, 64);

    // 2-1. 건우 (숙이기: 56x32)
    g.clear();
    g.fillStyle(0x26de81); g.fillRect(4, 6, 48, 26); 
    g.fillStyle(0x8854d0); g.fillRect(4, 16, 20, 16); 
    g.fillStyle(0xff4757); g.fillRect(30, 12, 8, 6); g.fillRect(42, 12, 8, 6); 
    g.generateTexture('heroGunwooSlide', 56, 32);

    // [바닥 장애물] - 점프용 (40x75)
    g.clear();
    g.fillStyle(0xeb4d4b); g.fillRect(0, 0, 40, 75);
    g.fillStyle(0xffbe76); g.fillRect(4, 6, 32, 12);
    g.generateTexture('obstacleHigh', 40, 75);

    // [공중 장애물] - 숙이기용 (120x35)
    g.clear();
    g.fillStyle(0xe74c3c); g.fillRect(0, 0, 120, 35);
    g.fillStyle(0xf1c40f); g.fillRect(8, 8, 104, 18);
    g.generateTexture('obstacleLow', 120, 35);

    // 동전
    g.clear();
    g.fillStyle(0xf1c40f); g.fillCircle(14, 14, 14);
    g.fillStyle(0xf39c12); g.fillCircle(14, 14, 8);
    g.generateTexture('coinBlock', 28, 28);

    // 하트
    g.clear();
    g.fillStyle(0xff4757);
    g.fillRect(4, 0, 8, 16); g.fillRect(12, 0, 8, 16);
    g.fillRect(0, 4, 24, 12); g.fillRect(4, 16, 16, 4); g.fillRect(8, 20, 8, 4);
    g.generateTexture('heartItem', 24, 24);
}

// 선택 화면
function createCharacterSelectScreen(scene) {
    selectScreenContainer = scene.add.container(0, 0).setDepth(100);

    let cx = scene.scale.width / 2;
    let cy = scene.scale.height / 2;

    let bgOverlay = scene.add.rectangle(cx, cy, scene.scale.width, scene.scale.height, 0x000000, 0.65);
    let titleText = scene.add.text(cx, cy - 160, '⚡ 건스패밀리 ⚡', {
        fontSize: '36px', color: '#f1c40f', style: 'bold'
    }).setOrigin(0.5);

    let subText = scene.add.text(cx, cy - 115, '캐릭터를 터치해서 시작하세요!', {
        fontSize: '18px', color: '#ffffff'
    }).setOrigin(0.5);

    let card1 = scene.add.rectangle(cx - 130, cy + 20, 210, 220, 0x2c2c54, 0.85).setInteractive();
    card1.setStrokeStyle(3, 0xa55eea);
    let img1 = scene.add.image(cx - 130, cy - 30, 'heroGunyoung').setScale(1.2);
    let name1 = scene.add.text(cx - 130, cy + 35, '건영 (블랙팬서)', { fontSize: '20px', color: '#a55eea', style: 'bold' }).setOrigin(0.5);
    let desc1 = scene.add.text(cx - 130, cy + 75, '스킬: 코인 자석\n+ 회피 보호막', { fontSize: '14px', color: '#dddddd', align: 'center' }).setOrigin(0.5);
    card1.on('pointerdown', () => selectHero(scene, 'GUNYOUNG'));

    let card2 = scene.add.rectangle(cx + 130, cy + 20, 210, 220, 0x1e824c, 0.85).setInteractive();
    card2.setStrokeStyle(3, 0x26de81);
    let img2 = scene.add.image(cx + 130, cy - 30, 'heroGunwoo').setScale(1.2);
    let name2 = scene.add.text(cx + 130, cy + 35, '건우 (헐크)', { fontSize: '20px', color: '#26de81', style: 'bold' }).setOrigin(0.5);
    let desc2 = scene.add.text(cx + 130, cy + 75, '스킬: 장애물 파괴\n+ 무적 돌진', { fontSize: '14px', color: '#dddddd', align: 'center' }).setOrigin(0.5);
    card2.on('pointerdown', () => selectHero(scene, 'GUNWOO'));

    selectScreenContainer.add([bgOverlay, titleText, subText, card1, img1, name1, desc1, card2, img2, name2, desc2]);
}

function selectHero(scene, heroType) {
    selectedHero = heroType;
    selectScreenContainer.setVisible(false);

    let texture = (heroType === 'GUNYOUNG') ? 'heroGunyoung' : 'heroGunwoo';
    let groundY = scene.scale.height - 80;

    player = scene.physics.add.sprite(160, groundY, texture);
    player.setOrigin(0.5, 1.0); 
    player.setCollideWorldBounds(true);

    scene.physics.add.collider(player, groundTile, () => {
        jumpCount = 0;
    });

    scene.physics.add.overlap(player, obstacles, hitObstacle, null, scene);
    scene.physics.add.overlap(player, coins, collectCoin, null, scene);
    scene.physics.add.overlap(player, hearts, collectHeart, null, scene);

    maxHP = (selectedHero === 'GUNWOO') ? 150 : 100;
    playerHP = maxHP;

    isGameRunning = true;

    // 첫 패턴 타이머 가동
    spawnTimerEvent = scene.time.addEvent({
        delay: spawnInterval,
        callback: () => { if (isGameRunning) spawnPattern(scene); },
        loop: true
    });
}

// 인게임 UI
function createInGameUI(scene) {
    let w = scene.scale.width;
    let h = scene.scale.height;

    scene.add.rectangle(130, 30, 204, 24, 0x333333).setDepth(50);
    hpBarFill = scene.add.rectangle(30, 30, 200, 20, 0x2ecc71).setOrigin(0, 0.5).setDepth(50);

    scene.add.rectangle(130, 60, 204, 14, 0x333333).setDepth(50);
    skillBarFill = scene.add.rectangle(30, 60, 0, 10, 0x9b59b6).setOrigin(0, 0.5).setDepth(50);

    // ⏱️ 단계 및 타이머 표시 UI (중앙 상단)
    phaseText = scene.add.text(w / 2, 35, 'PHASE 1 (30s)', {
        fontSize: '24px', color: '#e74c3c', style: 'bold', stroke: '#000', strokeThickness: 4
    }).setOrigin(0.5).setDepth(50);

    scoreText = scene.add.text(w - 20, 30, '점수: 0  |  🪙 0', {
        fontSize: '22px', color: '#f1c40f', style: 'bold'
    }).setOrigin(1, 0.5).setDepth(50);

    jumpBtn = scene.add.circle(85, h - 85, 50, 0x3498db, 0.8).setInteractive().setDepth(50);
    scene.add.text(85, h - 85, '점프', { fontSize: '20px', color: '#fff', style: 'bold' }).setOrigin(0.5).setDepth(51);

    slideBtn = scene.add.circle(205, h - 75, 45, 0xe67e22, 0.8).setInteractive().setDepth(50);
    scene.add.text(205, h - 75, '숙이기', { fontSize: '18px', color: '#fff', style: 'bold' }).setOrigin(0.5).setDepth(51);

    skillBtn = scene.add.circle(w - 85, h - 85, 55, 0x8e44ad, 0.5).setInteractive().setDepth(50);
    skillText = scene.add.text(w - 85, h - 85, '스킬!', { fontSize: '22px', color: '#fff', style: 'bold' }).setOrigin(0.5).setDepth(51);

    jumpBtn.on('pointerdown', () => handleJump(scene));
    slideBtn.on('pointerdown', () => handleSlide(scene, true));
    slideBtn.on('pointerup', () => handleSlide(scene, false));
    slideBtn.on('pointerout', () => handleSlide(scene, false));
    skillBtn.on('pointerdown', () => useHeroSkill(scene));
}

function handleJump(scene) {
    if (!isGameRunning || isSliding) return;
    if (jumpCount < 2) {
        player.setVelocityY(-620);
        jumpCount++;
    }
}

function handleSlide(scene, start) {
    if (!isGameRunning || !player) return;

    if (start && !isSliding) {
        isSliding = true;
        let slideTexture = (selectedHero === 'GUNYOUNG') ? 'heroGunyoungSlide' : 'heroGunwooSlide';
        player.setTexture(slideTexture);
        player.body.setSize(56, 32);

        if (!player.body.touching.down) {
            player.setVelocityY(650);
        }
    } else if (!start && isSliding) {
        isSliding = false;
        let standTexture = (selectedHero === 'GUNYOUNG') ? 'heroGunyoung' : 'heroGunwoo';
        player.setTexture(standTexture);
        player.body.setSize(48, 64);
    }
}

function useHeroSkill(scene) {
    if (skillGauge < 100 || isSkillActive || !isGameRunning) return;

    skillGauge = 0;
    isSkillActive = true;
    isSkillEndingSoon = false;

    if (selectedHero === 'GUNWOO') {
        scene.cameras.main.shake(400, 0.03);
        obstacles.children.iterate((obs) => { if (obs) obs.destroy(); });
    } else {
        scene.cameras.main.flash(300, 165, 94, 234);
    }

    warningTimer = scene.time.delayedCall(3500, () => {
        isSkillEndingSoon = true;
    });

    skillTimer = scene.time.delayedCall(5000, () => {
        isSkillActive = false;
        isSkillEndingSoon = false;
        shieldGraphics.clear();
        player.clearTint();
    });
}

function updateShieldEffect(scene) {
    shieldGraphics.clear();
    if (!isSkillActive || !player) return;

    let time = scene.time.now;
    let radius = (selectedHero === 'GUNWOO') ? 55 : 45;
    let mainColor = (selectedHero === 'GUNWOO') ? 0x26de81 : 0xa55eea;

    let centerY = player.y - (player.height / 2);

    if (isSkillEndingSoon) {
        let blink = Math.floor(time / 100) % 2 === 0;
        if (blink) {
            shieldGraphics.lineStyle(6, 0xff4757, 0.9);
            shieldGraphics.fillStyle(0xff4757, 0.2);
            shieldGraphics.strokeCircle(player.x, centerY, radius + 4);
            shieldGraphics.fillCircle(player.x, centerY, radius + 4);
        }
    } else {
        let alphaPulse = 0.3 + Math.sin(time / 150) * 0.15;
        shieldGraphics.lineStyle(5, mainColor, 0.9);
        shieldGraphics.strokeCircle(player.x, centerY, radius);
        shieldGraphics.fillStyle(mainColor, alphaPulse);
        shieldGraphics.fillCircle(player.x, centerY, radius);

        let angle = (time / 200) % (Math.PI * 2);
        let orbitalX = player.x + Math.cos(angle) * radius;
        let orbitalY = centerY + Math.sin(angle) * radius;
        shieldGraphics.fillStyle(0xffffff, 1);
        shieldGraphics.fillCircle(orbitalX, orbitalY, 6);
    }
}

// 🎲 다양한 패턴 생성기 (총 5개 패턴)
function spawnPattern(scene) {
    let groundY = scene.scale.height - 80;
    let type = Phaser.Math.Between(0, 10);

    if (type <= 2) {
        // [패턴 1] 단순 숙이기 + 바닥 코인
        let obsY = groundY - 40; 
        let obs = obstacles.create(scene.scale.width + 60, obsY, 'obstacleLow');
        obs.setOrigin(0, 1.0);
        obs.body.allowGravity = false;
        obs.setImmovable(true);

        for (let i = 0; i < 4; i++) {
            let coin = coins.create(scene.scale.width + 20 + (i * 38), groundY - 14, 'coinBlock');
            coin.setOrigin(0.5, 1.0);
            coin.body.allowGravity = false;
        }

    } else if (type <= 4) {
        // [패턴 2] 2연속 점프 장애물
        for (let i = 0; i < 2; i++) {
            let obs = obstacles.create(scene.scale.width + 50 + (i * 220), groundY, 'obstacleHigh');
            obs.setOrigin(0, 1.0);
            obs.body.allowGravity = false;
            obs.setImmovable(true);

            let coin = coins.create(scene.scale.width + 50 + (i * 220), groundY - 120, 'coinBlock');
            coin.setOrigin(0.5, 1.0);
            coin.body.allowGravity = false;
        }

    } else if (type <= 6) {
        // 🔥 [패턴 3 신규] 지그재그 콤보 (숙이고 바로 점프!)
        let obsLow = obstacles.create(scene.scale.width + 50, groundY - 40, 'obstacleLow');
        obsLow.setOrigin(0, 1.0);
        obsLow.body.allowGravity = false;
        obsLow.setImmovable(true);

        let obsHigh = obstacles.create(scene.scale.width + 280, groundY, 'obstacleHigh');
        obsHigh.setOrigin(0, 1.0);
        obsHigh.body.allowGravity = false;
        obsHigh.setImmovable(true);

    } else if (type <= 8) {
        // 🔥 [패턴 4 신규] 긴 공중 장벽 (길게 숙이기 유도)
        for (let i = 0; i < 2; i++) {
            let obsLow = obstacles.create(scene.scale.width + 50 + (i * 120), groundY - 40, 'obstacleLow');
            obsLow.setOrigin(0, 1.0);
            obsLow.body.allowGravity = false;
            obsLow.setImmovable(true);
        }
        for (let i = 0; i < 6; i++) {
            let coin = coins.create(scene.scale.width + 30 + (i * 35), groundY - 14, 'coinBlock');
            coin.setOrigin(0.5, 1.0);
            coin.body.allowGravity = false;
        }

    } else {
        // [패턴 5] 코인 파티 & 회복 하트
        for (let i = 0; i < 5; i++) {
            let coin = coins.create(scene.scale.width + (i * 35), groundY - 30, 'coinBlock');
            coin.setOrigin(0.5, 1.0);
            coin.body.allowGravity = false;
        }
        if (Phaser.Math.Between(0, 1) === 0) {
            let h = hearts.create(scene.scale.width + 220, groundY - 100, 'heartItem');
            h.setOrigin(0.5, 1.0);
            h.body.allowGravity = false;
        }
    }
}

function hitObstacle(p, obs) {
    if (isSkillActive) {
        obs.destroy();
        score += 300;
        return;
    }

    obs.destroy();
    playerHP -= 25;
    this.cameras.main.shake(200, 0.015);
    if (navigator.vibrate) navigator.vibrate(120);

    if (playerHP <= 0) {
        gameOver(this);
    }
}

function collectCoin(p, coin) {
    coin.destroy();
    score += 100;
    coinCount++;

    if (skillGauge < 100) {
        skillGauge += 1.5;
    }
}

function collectHeart(p, h) {
    h.destroy();
    playerHP = Math.min(maxHP, playerHP + 30);
}

function updateUI() {
    scoreText.setText(`점수: ${score}  |  🪙 ${coinCount}`);

    // 단계 및 다음 단계까지 시간 계산
    let nextLevelSec = 30 - (gameTimer % 30);
    phaseText.setText(`PHASE ${gamePhase} (${nextLevelSec}s)`);

    let hpRatio = Math.max(0, playerHP / maxHP);
    hpBarFill.width = 200 * hpRatio;

    skillBarFill.width = 200 * (Math.min(100, skillGauge) / 100);

    if (skillGauge >= 100) {
        skillBtn.setAlpha(1.0);
        skillBtn.setFillStyle(0x9b59b6);
    } else {
        skillBtn.setAlpha(0.4);
        skillBtn.setFillStyle(0x555555);
    }
}

function gameOver(scene) {
    isGameRunning = false;
    scene.physics.pause();
    shieldGraphics.clear();
    if (spawnTimerEvent) spawnTimerEvent.remove();

    let cx = scene.scale.width / 2;
    let cy = scene.scale.height / 2;

    scene.add.text(cx, cy - 60, 'GAME OVER', {
        fontSize: '48px', color: '#e74c3c', style: 'bold'
    }).setOrigin(0.5).setDepth(100);

    scene.add.text(cx, cy + 40, `도달 단계: PHASE ${gamePhase}\n최종 점수: ${score}\n획득 코인: 🪙 ${coinCount}\n\n[화면을 터치하여 다시 시작]`, {
        fontSize: '22px', color: '#ffffff', align: 'center', lineSpacing: 8
    }).setOrigin(0.5).setDepth(100);

    scene.input.once('pointerdown', () => {
        score = 0;
        coinCount = 0;
        skillGauge = 0;
        isSkillActive = false;
        isSkillEndingSoon = false;
        scene.scene.restart();
    });
}

function repositionUI(scene, gameSize) {
    let w = gameSize.width;
    let h = gameSize.height;

    if (jumpBtn) jumpBtn.setPosition(85, h - 85);
    if (slideBtn) slideBtn.setPosition(205, h - 75);
    if (skillBtn) skillBtn.setPosition(w - 85, h - 85);
    if (skillText) skillText.setPosition(w - 85, h - 85);
    if (scoreText) scoreText.setPosition(w - 20, 30);
    if (phaseText) phaseText.setPosition(w / 2, 35);
}
</script>
