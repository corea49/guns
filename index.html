<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>건스패밀리 (Guns Family)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e15;
            touch-action: none;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
/**
 * Web Audio API Synth Sound Generator
 */
class SoundFx {
    constructor() {
        this.ctx = null;
        this.bgmTimer = null;
        this.isBgmPlaying = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playCoin() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987.77, this.ctx.currentTime); // B5
        osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08); // E6

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
    }

    playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    playSkill() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }

    startBGM() {
        if (this.isBgmPlaying) return;
        this.init();
        this.isBgmPlaying = true;
        let noteIdx = 0;
        const notes = [220, 247, 261, 293, 329, 293, 261, 247]; // Synth Bass loop

        this.bgmTimer = setInterval(() => {
            if (!this.isBgmPlaying || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(notes[noteIdx % notes.length], this.ctx.currentTime);

            gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
            noteIdx++;
        }, 200);
    }

    stopBGM() {
        this.isBgmPlaying = false;
        if (this.bgmTimer) clearInterval(this.bgmTimer);
    }
}

const soundFx = new SoundFx();

/**
 * Main Game Scene
 */
class MainGameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainGameScene' });
    }

    init(data) {
        this.selectedChar = data.character || 'gunyoung'; // 'gunyoung' 또는 'gunwoo'
    }

    preload() {
        // Procedural Textures 생성
        this.createProceduralTextures();
    }

    createProceduralTextures() {
        // 건영 (블랙팬서 컨셉: 보라/블랙)
        const gyGfx = this.make.graphics({x: 0, y: 0, add: false});
        gyGfx.fillStyle(0x111118);
        gyGfx.fillRoundedRect(0, 0, 50, 70, 8);
        gyGfx.lineStyle(3, 0xa855f7);
        gyGfx.strokeRoundedRect(2, 2, 46, 66, 6);
        gyGfx.fillStyle(0xa855f7);
        gyGfx.fillRect(30, 15, 15, 8); // 눈/바이저
        gyGfx.generateTexture('char_gunyoung', 50, 70);

        // 건우 (헐크 컨셉: 녹색/대형)
        const gwGfx = this.make.graphics({x: 0, y: 0, add: false});
        gwGfx.fillStyle(0x15803d);
        gwGfx.fillRoundedRect(0, 0, 60, 80, 8);
        gwGfx.lineStyle(4, 0x4ade80);
        gwGfx.strokeRoundedRect(2, 2, 56, 76, 6);
        gwGfx.fillStyle(0xef4444);
        gwGfx.fillRect(35, 18, 18, 8); // 눈
        gwGfx.generateTexture('char_gunwoo', 60, 80);

        // 바닥 Obstacle (높은 장애물)
        const obsHigh = this.make.graphics({x: 0, y: 0, add: false});
        obsHigh.fillStyle(0xef4444);
        obsHigh.fillRect(0, 0, 45, 65);
        obsHigh.lineStyle(3, 0xffffff);
        obsHigh.strokeRect(0, 0, 45, 65);
        obsHigh.generateTexture('obs_high', 45, 65);

        // 공중 Obstacle (숙이기용)
        const obsAir = this.make.graphics({x: 0, y: 0, add: false});
        obsAir.fillStyle(0xf97316);
        obsAir.fillRect(0, 0, 70, 40);
        obsAir.lineStyle(3, 0xffffff);
        obsAir.strokeRect(0, 0, 70, 40);
        obsAir.generateTexture('obs_air', 70, 40);

        // 코인
        const coinGfx = this.make.graphics({x: 0, y: 0, add: false});
        coinGfx.fillStyle(0xeab308);
        coinGfx.fillCircle(12, 12, 12);
        coinGfx.lineStyle(2, 0xffffff);
        coinGfx.strokeCircle(12, 12, 10);
        coinGfx.generateTexture('item_coin', 24, 24);

        // 하트 (HP 회복)
        const heartGfx = this.make.graphics({x: 0, y: 0, add: false});
        heartGfx.fillStyle(0xec4899);
        heartGfx.fillCircle(8, 8, 8);
        heartGfx.fillCircle(18, 8, 8);
        heartGfx.fillTriangle(0, 10, 26, 10, 13, 24);
        heartGfx.generateTexture('item_heart', 26, 26);
    }

    create() {
        soundFx.startBGM();

        // 120Hz 지원을 위한 터치 포인트 설정 (3개 이상 멀티터치 지원)
        this.input.addPointer(2);

        // 스펙 세팅
        if (this.selectedChar === 'gunyoung') {
            this.maxHp = 100;
            this.charTexture = 'char_gunyoung';
            this.gaugeMultiplier = 1.5; // 스킬 게이지 1.5배
            this.skillType = 'MAGNET_SHIELD';
        } else {
            this.maxHp = 150;
            this.charTexture = 'char_gunwoo';
            this.gaugeMultiplier = 1.0;
            this.skillType = 'DESTROY_RUSH';
        }

        this.hp = this.maxHp;
        this.score = 0;
        this.skillGauge = 0; // 0 ~ 100
        this.isSkillActive = false;
        this.skillTimer = 0;
        this.isSliding = false;
        this.phase = 1;
        this.baseSpeed = 380; // 초당 이동 픽셀 (Frame Independent)
        this.currentSpeed = this.baseSpeed;
        this.phaseTime = 0;

        // SafeArea 및 화면 배치
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        this.groundY = height - 120; // Y축 여백 하향 배치로 주소창/하단바 interference 방지

        // 배경
        this.bg = this.add.tileSprite(width / 2, height / 2, width, height, null).setTileScale(1, 1);
        const bgGfx = this.add.graphics();
        bgGfx.fillStyle(0x1e1e2e);
        bgGfx.fillRect(0, 0, width, height);
        bgGfx.lineStyle(1, 0x313244, 0.5);
        for(let i=0; i<width; i+=40) bgGfx.lineBetween(i, 0, i, height);

        // 바닥 그래픽
        this.ground = this.add.rectangle(width / 2, this.groundY + 30, width, 60, 0x334155);
        this.physics.add.existing(this.ground, true);

        // 플레이어 설정
        this.player = this.physics.add.sprite(120, this.groundY - 50, this.charTexture);
        this.player.setCollideWorldBounds(true);
        this.player.setGravityY(1600);
        this.physics.add.collider(this.player, this.ground);

        // 플레이어 히트박스 보정
        this.originalBodyWidth = this.player.width;
        this.originalBodyHeight = this.player.height;

        // 스킬 보호막 이펙트 (Graphics)
        this.shieldGfx = this.add.graphics();
        this.shieldGfx.setVisible(false);

        // 그룹 생성
        this.obstacles = this.physics.add.group();
        this.coins = this.physics.add.group();
        this.hearts = this.physics.add.group();

        // 충돌 설정
        this.physics.add.overlap(this.player, this.obstacles, this.handleObstacleCollision, null, this);
        this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
        this.physics.add.overlap(this.player, this.hearts, this.collectHeart, null, this);

        // 장애물/아이템 스폰 타이머
        this.spawnTimer = 0;
        this.spawnInterval = 2.0; // 초 단위

        // UI 레이아웃 (SafeArea 고려)
        this.createUI();

        // 모바일 터치 컨트롤 생성
        this.createControls();

        // Fullscreen 이벤트
        this.input.on('pointerdown', () => {
            if (!this.scale.isFullscreen) {
                this.scale.startFullscreen();
            }
        });
    }

    createUI() {
        const width = this.cameras.main.width;
        
        // HP 바
        this.add.rectangle(140, 40, 204, 24, 0x000000, 0.5);
        this.hpBar = this.add.rectangle(40, 40, 200, 20, 0x22c55e).setOrigin(0, 0.5);

        // 스킬 게이지 바
        this.add.rectangle(140, 70, 204, 18, 0x000000, 0.5);
        this.skillBar = this.add.rectangle(40, 70, 0, 14, 0x3b82f6).setOrigin(0, 0.5);

        // 텍스트 UI
        this.scoreText = this.add.text(width - 40, 35, 'SCORE: 0', { fontSize: '22px', color: '#fff', fontStyle: 'bold' }).setOrigin(1, 0.5);
        this.phaseText = this.add.text(width / 2, 35, 'PHASE 1', { fontSize: '24px', color: '#eab308', fontStyle: 'bold' }).setOrigin(0.5);

        // Phase Up 알림 텍스트
        this.phaseUpText = this.add.text(width / 2, 180, 'PHASE UP!', { fontSize: '48px', color: '#facc15', fontStyle: 'bold' })
            .setOrigin(0.5).setAlpha(0);
    }

    createControls() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        const btnY = height - 60; // 터치 피로도를 고려한 하단 배치

        // 점프 버튼 (좌측)
        const jumpBtn = this.add.circle(100, btnY, 48, 0x3b82f6, 0.6).setInteractive();
        this.add.text(100, btnY, 'JUMP', { fontSize: '18px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        jumpBtn.on('pointerdown', () => {
            this.handleJump();
        });

        // 숙이기(Slide) 버튼 (중앙 우측)
        const slideBtn = this.add.circle(width - 220, btnY, 48, 0x8b5cf6, 0.6).setInteractive();
        this.add.text(width - 220, btnY, 'SLIDE', { fontSize: '18px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        // 터치 완벽 대응: pointerdown, pointerup, pointerout, pointercancel 모두 등록
        const startSlide = () => { this.setSliding(true); };
        const stopSlide = () => { this.setSliding(false); };

        slideBtn.on('pointerdown', startSlide);
        slideBtn.on('pointerup', stopSlide);
        slideBtn.on('pointerout', stopSlide);
        slideBtn.on('pointercancel', stopSlide);

        // 스킬 버튼 (우측)
        this.skillBtn = this.add.circle(width - 90, btnY, 48, 0x64748b, 0.6).setInteractive();
        this.skillBtnText = this.add.text(width - 90, btnY, 'SKILL', { fontSize: '18px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        this.skillBtn.on('pointerdown', () => {
            this.activateSkill();
        });
    }

    handleJump() {
        if (this.player.body.touching.down && !this.isSliding) {
            this.player.setVelocityY(-650);
            soundFx.playJump();
        }
    }

    setSliding(sliding) {
        if (this.isSliding === sliding) return;
        this.isSliding = sliding;

        if (sliding) {
            this.player.setScale(1, 0.5);
            if (this.player.body.touching.down) {
                this.player.y += 15;
            }
        } else {
            this.player.setScale(1, 1);
        }
    }

    activateSkill() {
        if (this.skillGauge >= 100 && !this.isSkillActive) {
            this.isSkillActive = true;
            this.skillGauge = 0;
            this.skillTimer = 6.0; // 6초간 유지
            soundFx.playSkill();

            // 건우 스킬: 화면 내 모든 장애물 즉시 파괴
            if (this.skillType === 'DESTROY_RUSH') {
                this.obstacles.getChildren().forEach(obs => {
                    this.createExplosion(obs.x, obs.y);
                });
                this.obstacles.clear(true, true);
                this.cameras.main.shake(200, 0.01);
            }
        }
    }

    update(time, delta) {
        // Delta 시간(초) 계산: 120Hz/60Hz 가변 주사율 보정
        const dt = delta / 1000;

        // Phase 난이도 상승 (30초마다)
        this.phaseTime += dt;
        if (this.phaseTime >= 30) {
            this.phaseTime = 0;
            this.phase++;
            this.currentSpeed += 60; // 속도 증가
            this.spawnInterval = Math.max(0.8, this.spawnInterval - 0.25); // 스폰 간격 단축
            this.phaseText.setText(`PHASE ${this.phase}`);

            // Phase Up 연출 (플래시, 진동, 텍스트)
            this.cameras.main.flash(300, 255, 255, 255);
            if (navigator.vibrate) navigator.vibrate(200);

            this.tweens.add({
                targets: this.phaseUpText,
                alpha: 1,
                scale: { from: 0.5, to: 1.2 },
                duration: 400,
                yoyo: true,
                hold: 600,
                onComplete: () => this.phaseUpText.setAlpha(0)
            });
        }

        // 스킬 타이머 처리
        if (this.isSkillActive) {
            this.skillTimer -= dt;
            if (this.skillTimer <= 0) {
                this.isSkillActive = false;
                this.shieldGfx.setVisible(false);
            } else {
                this.updateShieldEffect();
            }
        }

        // 건영 스킬: 코인 자석 연출
        if (this.isSkillActive && this.skillType === 'MAGNET_SHIELD') {
            this.coins.getChildren().forEach(coin => {
                const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y, coin.x, coin.y);
                if (dist < 350) {
                    this.physics.moveToObject(coin, this.player, 700);
                }
            });
        }

        // 장애물/아이템 스폰 관리
        this.spawnTimer += dt;
        if (this.spawnTimer >= this.spawnInterval) {
            this.spawnTimer = 0;
            this.spawnPattern();
        }

        // 객체 이동 (Frame Independent: dt 곱연산 적용)
        const moveDistance = this.currentSpeed * dt;

        this.obstacles.getChildren().forEach(obs => {
            obs.x -= moveDistance;
            if (obs.x < -100) obs.destroy();
        });

        this.coins.getChildren().forEach(coin => {
            if (!this.isSkillActive || this.skillType !== 'MAGNET_SHIELD') {
                coin.x -= moveDistance;
            }
            if (coin.x < -50) coin.destroy();
        });

        this.hearts.getChildren().forEach(heart => {
            heart.x -= moveDistance;
            if (heart.x < -50) heart.destroy();
        });

        // UI 점수 업데이트
        this.score += Math.floor(dt * 100);
        this.scoreText.setText(`SCORE: ${this.score}`);

        // UI 게이지 업데이트
        this.hpBar.width = Phaser.Math.Clamp((this.hp / this.maxHp) * 200, 0, 200);
        this.skillBar.width = Phaser.Math.Clamp((this.skillGauge / 100) * 200, 0, 200);

        if (this.skillGauge >= 100 && !this.isSkillActive) {
            this.skillBtn.setFillStyle(0x3b82f6, 1.0);
        } else {
            this.skillBtn.setFillStyle(0x64748b, 0.6);
        }
    }

    updateShieldEffect() {
        this.shieldGfx.clear();
        this.shieldGfx.setVisible(true);

        // 스킬 종료 1.5초 전 점박/경고 연출
        if (this.skillTimer <= 1.5 && Math.floor(this.time.now / 100) % 2 === 0) {
            return;
        }

        const color = (this.skillType === 'MAGNET_SHIELD') ? 0xa855f7 : 0x22c55e;
        this.shieldGfx.lineStyle(4, color, 0.8);
        this.shieldGfx.strokeCircle(this.player.x, this.player.y, 45);

        // 회전하는 이펙트 알갱이
        const angle = (this.time.now / 4) % 360;
        const rad = Phaser.Math.DegToRad(angle);
        const px = this.player.x + Math.cos(rad) * 45;
        const py = this.player.y + Math.sin(rad) * 45;

        this.shieldGfx.fillStyle(0xffffff, 1);
        this.shieldGfx.fillCircle(px, py, 6);
    }

    spawnPattern() {
        const width = this.cameras.main.width;
        const rand = Phaser.Math.Between(1, 3);

        if (rand === 1) {
            // 패턴 1: 점프형 높은 장애물
            const obs = this.obstacles.create(width + 50, this.groundY - 32, 'obs_high');
            obs.body.allowGravity = false;
            obs.setImmovable(true);

            // 상단 코인 배치
            for(let i=0; i<3; i++) {
                const coin = this.coins.create(width + 50 + (i * 35), this.groundY - 120, 'item_coin');
                coin.body.allowGravity = false;
            }
        } else if (rand === 2) {
            // 패턴 2: 숙이기용 공중 장애물 + 아래 코인
            const obs = this.obstacles.create(width + 50, this.groundY - 85, 'obs_air');
            obs.body.allowGravity = false;
            obs.setImmovable(true);

            for(let i=0; i<3; i++) {
                const coin = this.coins.create(width + 30 + (i * 35), this.groundY - 20, 'item_coin');
                coin.body.allowGravity = false;
            }
        } else {
            // 패턴 3: 연속 코인 + 확률적 하트
            for(let i=0; i<4; i++) {
                const coin = this.coins.create(width + 50 + (i * 40), this.groundY - 30, 'item_coin');
                coin.body.allowGravity = false;
            }
            if (Phaser.Math.Between(1, 10) > 6) {
                const heart = this.hearts.create(width + 230, this.groundY - 80, 'item_heart');
                heart.body.allowGravity = false;
            }
        }
    }

    handleObstacleCollision(player, obstacle) {
        // 무적 돌진 스킬 상태일 때 장애물 파괴
        if (this.isSkillActive && this.skillType === 'DESTROY_RUSH') {
            this.createExplosion(obstacle.x, obstacle.y);
            obstacle.destroy();
            soundFx.playHit();
            return;
        }

        // 회피 보호막 스킬 상태일 때 데미지 무시 및 방어 이펙트
        if (this.isSkillActive && this.skillType === 'MAGNET_SHIELD') {
            obstacle.destroy();
            soundFx.playHit();
            return;
        }

        // 일반 상태 피격
        obstacle.destroy();
        soundFx.playHit();
        this.hp -= 25;
        this.cameras.main.shake(150, 0.015);
        this.player.setTint(0xff0000);
        this.time.delayedCall(150, () => this.player.clearTint());

        if (this.hp <= 0) {
            this.gameOver();
        }
    }

    collectCoin(player, coin) {
        coin.destroy();
        soundFx.playCoin();
        this.score += 50;

        if (!this.isSkillActive) {
            this.skillGauge = Math.min(100, this.skillGauge + (8 * this.gaugeMultiplier));
        }
    }

    collectHeart(player, heart) {
        heart.destroy();
        soundFx.playCoin();
        this.hp = Math.min(this.maxHp, this.hp + 30);
    }

    createExplosion(x, y) {
        const emitter = this.add.particles(x, y, 'item_coin', {
            speed: { min: -200, max: 200 },
            angle: { min: 0, max: 360 },
            scale: { start: 0.5, end: 0 },
            blendMode: 'ADD',
            lifespan: 300,
            gravityY: 0
        });
        this.time.delayedCall(300, () => emitter.destroy());
    }

    gameOver() {
        soundFx.stopBGM();
        this.scene.start('GameOverScene', { score: this.score });
    }
}

/**
 * Character Select Scene
 */
class CharSelectScene extends Phaser.Scene {
    constructor() {
        super({ key: 'CharSelectScene' });
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        this.add.text(width / 2, 80, '건스패밀리', { fontSize: '40px', color: '#facc15', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2, 130, '캐릭터를 선택하세요', { fontSize: '20px', color: '#fff' }).setOrigin(0.5);

        // 건영 카드
        const card1 = this.add.rectangle(width / 2 - 140, height / 2, 220, 280, 0x1e1e2e).setStrokeStyle(3, 0xa855f7).setInteractive();
        this.add.rectangle(width / 2 - 140, height / 2 - 50, 50, 70, 0x111118).setStrokeStyle(2, 0xa855f7);
        this.add.text(width / 2 - 140, height / 2 + 20, '건영 (블랙팬서)', { fontSize: '20px', color: '#a855f7', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2 - 140, height / 2 + 70, 'HP: 100\n게이지 충전 1.5배\n스킬: 자석+보호막', { fontSize: '14px', color: '#ccc', align: 'center' }).setOrigin(0.5);

        // 건우 카드
        const card2 = this.add.rectangle(width / 2 + 140, height / 2, 220, 280, 0x1e1e2e).setStrokeStyle(3, 0x22c55e).setInteractive();
        this.add.rectangle(width / 2 + 140, height / 2 - 50, 60, 80, 0x15803d).setStrokeStyle(2, 0x4ade80);
        this.add.text(width / 2 + 140, height / 2 + 20, '건우 (헐크)', { fontSize: '20px', color: '#22c55e', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2 + 140, height / 2 + 70, 'HP: 150\n높은 생존력\n스킬: 전멸+무적돌진', { fontSize: '14px', color: '#ccc', align: 'center' }).setOrigin(0.5);

        card1.on('pointerdown', () => {
            soundFx.init();
            this.scene.start('MainGameScene', { character: 'gunyoung' });
        });

        card2.on('pointerdown', () => {
            soundFx.init();
            this.scene.start('MainGameScene', { character: 'gunwoo' });
        });
    }
}

/**
 * Game Over Scene
 */
class GameOverScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameOverScene' });
    }

    init(data) {
        this.finalScore = data.score || 0;
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        this.add.text(width / 2, height / 2 - 80, 'GAME OVER', { fontSize: '48px', color: '#ef4444', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2, height / 2, `FINAL SCORE: ${this.finalScore}`, { fontSize: '28px', color: '#fff' }).setOrigin(0.5);

        const restartBtn = this.add.rectangle(width / 2, height / 2 + 90, 200, 50, 0x3b82f6).setInteractive();
        this.add.text(width / 2, height / 2 + 90, '다시 하기', { fontSize: '22px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        restartBtn.on('pointerdown', () => {
            this.scene.start('CharSelectScene');
        });
    }
}

// Phaser Game Configuration
const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 960,
    height: 540,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [CharSelectScene, MainGameScene, GameOverScene]
};

const game = new Phaser.Game(config);
</script>
