<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>건스패밀리 (Guns Family)</title>
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0e15;
            touch-action: none;
            font-family: 'Pretendard', -apple-system, sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

<div id="game-container"></div>

<script>
/**
 * Web Audio API Synth Sound Generator
 */
class SoundFx {
    constructor() {
        this.ctx = null;
        this.bgmTimer = null;
        this.isBgmPlaying = false;
    }

    init() {
        if (!this.ctx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    }

    playJump() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, this.ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
    }

    playCoin() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(987.77, this.ctx.currentTime);
        osc.frequency.setValueAtTime(1318.51, this.ctx.currentTime + 0.08);

        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.25);
    }

    playHit() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(120, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.2);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.2);
    }

    playSkill() {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.connect(gain);
        gain.connect(this.ctx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.4);

        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);

        osc.start();
        osc.stop(this.ctx.currentTime + 0.4);
    }

    startBGM() {
        if (this.isBgmPlaying) return;
        this.init();
        this.isBgmPlaying = true;
        let noteIdx = 0;
        const notes = [220, 247, 261, 293, 329, 293, 261, 247];

        this.bgmTimer = setInterval(() => {
            if (!this.isBgmPlaying || !this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.connect(gain);
            gain.connect(this.ctx.destination);

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(notes[noteIdx % notes.length], this.ctx.currentTime);

            gain.gain.setValueAtTime(0.05, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);

            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
            noteIdx++;
        }, 200);
    }

    stopBGM() {
        this.isBgmPlaying = false;
        if (this.bgmTimer) clearInterval(this.bgmTimer);
    }
}

const soundFx = new SoundFx();

/**
 * Main Game Scene
 */
class MainGameScene extends Phaser.Scene {
    constructor() {
        super({ key: 'MainGameScene' });
    }

    init(data) {
        this.selectedChar = data.character || 'gunyoung';
    }

    preload() {
        this.createProceduralTextures();
    }

    createProceduralTextures() {
        // ==========================================
        // 1. 건영 (블랙팬서 - 디테일 고품질 디자인)
        // ==========================================
        const gyCanvas = this.textures.createCanvas('char_gunyoung', 70, 90);
        const ctx1 = gyCanvas.context;

        // 슈트 기본 입체 베이스 (다크 챠콜)
        let gradGY = ctx1.createLinearGradient(0, 0, 70, 90);
        gradGY.addColorStop(0, '#2a2a38');
        gradGY.addColorStop(0.5, '#12121c');
        gradGY.addColorStop(1, '#08080f');
        ctx1.fillStyle = gradGY;
        
        // 메인 바디 패스
        ctx1.beginPath();
        ctx1.moveTo(20, 15); ctx1.lineTo(30, 2); ctx1.lineTo(40, 15); // 고양이 귀
        ctx1.lineTo(55, 18); ctx1.lineTo(62, 35); ctx1.lineTo(58, 65); // 우측 상체
        ctx1.lineTo(50, 88); ctx1.lineTo(20, 88); ctx1.lineTo(12, 65); // 하체 및 좌측
        ctx1.lineTo(8, 35); ctx1.lineTo(15, 18);
        ctx1.closePath();
        ctx1.fill();

        // 비브라늄 보라색 은은한 테두리
        ctx1.strokeStyle = '#c084fc';
        ctx1.lineWidth = 2.5;
        ctx1.stroke();

        // 가슴 근육 & 비브라늄 에너지 텍스처 (V자 발광 라인)
        ctx1.strokeStyle = '#a855f7';
        ctx1.lineWidth = 2;
        ctx1.beginPath();
        ctx1.moveTo(22, 38); ctx1.lineTo(35, 52); ctx1.lineTo(48, 38);
        ctx1.moveTo(25, 45); ctx1.lineTo(35, 56); ctx1.lineTo(45, 45);
        ctx1.moveTo(35, 56); ctx1.lineTo(35, 75); // 중앙 라인
        ctx1.stroke();

        // 비브라늄 핑거 목걸이 (금속 송곳니 형태)
        ctx1.fillStyle = '#e2e8f0';
        for(let i=0; i<5; i++) {
            ctx1.beginPath();
            ctx1.moveTo(22 + i*6, 30);
            ctx1.lineTo(25 + i*6, 37);
            ctx1.lineTo(28 + i*6, 30);
            ctx1.fill();
        }

        // 마스크 안광 (Visor Eye - 날카로운 발광 바이저)
        ctx1.fillStyle = '#f0abfc';
        ctx1.shadowColor = '#c084fc';
        ctx1.shadowBlur = 8;
        ctx1.beginPath();
        ctx1.moveTo(38, 20); ctx1.lineTo(52, 17); ctx1.lineTo(48, 24); ctx1.closePath(); ctx1.fill();
        ctx1.beginPath();
        ctx1.moveTo(32, 20); ctx1.lineTo(18, 17); ctx1.lineTo(22, 24); ctx1.closePath(); ctx1.fill();
        ctx1.shadowBlur = 0; // 그림자 초기화

        gyCanvas.refresh();

        // ==========================================
        // 2. 건우 (헐크 - 디테일 고품질 디자인)
        // ==========================================
        const gwCanvas = this.textures.createCanvas('char_gunwoo', 85, 100);
        const ctx2 = gwCanvas.context;

        // 피부 근육 베이스 (딥 그린 음영)
        let gradGW = ctx2.createLinearGradient(0, 0, 85, 100);
        gradGW.addColorStop(0, '#22c55e');
        gradGW.addColorStop(0.6, '#15803d');
        gradGW.addColorStop(1, '#064e3b');
        ctx2.fillStyle = gradGW;

        // 거대한 상체 & 근육 바디 패스
        ctx2.beginPath();
        ctx2.moveTo(20, 20); ctx2.lineTo(35, 8); ctx2.lineTo(50, 8); ctx2.lineTo(65, 20); // 머리
        ctx2.lineTo(80, 25); ctx2.lineTo(82, 60); ctx2.lineTo(70, 70); // 압도적인 어깨/상체
        ctx2.lineTo(68, 98); ctx2.lineTo(17, 98); ctx2.lineTo(15, 70); // 하체
        ctx2.lineTo(3, 60); ctx2.lineTo(5, 25);
        ctx2.closePath();
        ctx2.fill();

        ctx2.strokeStyle = '#4ade80';
        ctx2.lineWidth = 3;
        ctx2.stroke();

        // 대흉근 & 복근 디테일 선 (음영 깊이)
        ctx2.strokeStyle = '#052e16';
        ctx2.lineWidth = 3;
        ctx2.beginPath();
        // 가슴근육
        ctx2.arc(32, 42, 13, 0, Math.PI, false);
        ctx2.arc(53, 42, 13, 0, Math.PI, false);
        // 복근 6팩
        ctx2.moveTo(42, 42); ctx2.lineTo(42, 70);
        ctx2.moveTo(30, 55); ctx2.lineTo(55, 55);
        ctx2.moveTo(32, 65); ctx2.lineTo(53, 65);
        ctx2.stroke();

        // 시그니처 찢어진 보라색 바지
        ctx2.fillStyle = '#6b21a8';
        ctx2.beginPath();
        ctx2.moveTo(14, 70); ctx2.lineTo(71, 70);
        ctx2.lineTo(73, 95); ctx2.lineTo(60, 92); ctx2.lineTo(50, 98); ctx2.lineTo(35, 91); ctx2.lineTo(20, 97); ctx2.lineTo(12, 92);
        ctx2.closePath();
        ctx2.fill();

        // 얼굴 - 찌푸린 분노의 눈썹 & 붉은 눈 & 이빨
        ctx2.fillStyle = '#ef4444'; // 분노한 눈
        ctx2.beginPath(); ctx2.arc(33, 23, 3.5, 0, Math.PI * 2); ctx2.fill();
        ctx2.beginPath(); ctx2.arc(52, 23, 3.5, 0, Math.PI * 2); ctx2.fill();

        ctx2.strokeStyle = '#022c22'; // 검은 찌푸린 눈썹
        ctx2.lineWidth = 4;
        ctx2.beginPath();
        ctx2.moveTo(26, 18); ctx2.lineTo(38, 23);
        ctx2.moveTo(59, 18); ctx2.lineTo(47, 23);
        ctx2.stroke();

        // 분노의 이빨 앙물기
        ctx2.fillStyle = '#ffffff';
        ctx2.fillRect(36, 29, 13, 5);
        ctx2.strokeStyle = '#000000';
        ctx2.lineWidth = 1;
        ctx2.strokeRect(36, 29, 13, 5);

        // 머리 잔머리 (더부룩한 헐크 머리)
        ctx2.fillStyle = '#064e3b';
        ctx2.beginPath();
        ctx2.moveTo(26, 12); ctx2.lineTo(30, 3); ctx2.lineTo(36, 10);
        ctx2.lineTo(42, 2); ctx2.lineTo(48, 10); ctx2.lineTo(55, 4); ctx2.lineTo(58, 12);
        ctx2.fill();

        gwCanvas.refresh();

        // ==========================================
        // 3. 장애물 & 아이템 고급 텍스처
        // ==========================================
        const obsHigh = this.make.graphics({x: 0, y: 0, add: false});
        obsHigh.fillStyle(0xd97706);
        obsHigh.fillRoundedRect(0, 0, 45, 65, 6);
        obsHigh.lineStyle(3, 0xfef08a);
        obsHigh.strokeRoundedRect(2, 2, 41, 61, 4);
        obsHigh.generateTexture('obs_high', 45, 65);

        const obsAir = this.make.graphics({x: 0, y: 0, add: false});
        obsAir.fillStyle(0xdc2626);
        obsAir.fillRoundedRect(0, 0, 75, 40, 6);
        obsAir.lineStyle(3, 0xfca5a5);
        obsAir.strokeRoundedRect(2, 2, 71, 36, 4);
        obsAir.generateTexture('obs_air', 75, 40);

        // 입체 코인
        const coinGfx = this.make.graphics({x: 0, y: 0, add: false});
        coinGfx.fillStyle(0xeab308);
        coinGfx.fillCircle(14, 14, 14);
        coinGfx.fillStyle(0xfef08a);
        coinGfx.fillCircle(11, 11, 10);
        coinGfx.fillStyle(0xca8a04);
        coinGfx.fillCircle(14, 14, 8);
        coinGfx.generateTexture('item_coin', 28, 28);

        // 하트
        const heartGfx = this.make.graphics({x: 0, y: 0, add: false});
        heartGfx.fillStyle(0xec4899);
        heartGfx.fillCircle(8, 8, 8);
        heartGfx.fillCircle(18, 8, 8);
        heartGfx.fillTriangle(0, 10, 26, 10, 13, 24);
        heartGfx.generateTexture('item_heart', 26, 26);
    }

    create() {
        soundFx.startBGM();
        this.input.addPointer(2);

        if (this.selectedChar === 'gunyoung') {
            this.maxHp = 100;
            this.charTexture = 'char_gunyoung';
            this.gaugeMultiplier = 1.5; // 코인 약 67개면 풀충전
            this.skillType = 'MAGNET_SHIELD';
        } else {
            this.maxHp = 150;
            this.charTexture = 'char_gunwoo';
            this.gaugeMultiplier = 1.0; // 코인 100개 풀충전
            this.skillType = 'DESTROY_RUSH';
        }

        this.hp = this.maxHp;
        this.score = 0;
        this.coinCount = 0;
        this.isSkillActive = false;
        this.skillTimer = 0;
        this.isSliding = false;
        this.phase = 1;
        this.baseSpeed = 380;
        this.currentSpeed = this.baseSpeed;
        this.phaseTime = 0;

        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        this.groundY = height - 100;

        // 배경
        this.bg = this.add.tileSprite(width / 2, height / 2, width, height, null).setTileScale(1, 1);
        const bgGfx = this.add.graphics();
        bgGfx.fillStyle(0x0f172a);
        bgGfx.fillRect(0, 0, width, height);
        bgGfx.lineStyle(1, 0x1e293b, 0.5);
        for(let i=0; i<width; i+=40) bgGfx.lineBetween(i, 0, i, height);

        // 바닥
        this.ground = this.add.rectangle(width / 2, this.groundY + 30, width, 60, 0x334155);
        this.physics.add.existing(this.ground, true);

        // 플레이어 설정
        this.player = this.physics.add.sprite(120, this.groundY, this.charTexture);
        this.player.setOrigin(0.5, 1);
        this.player.setCollideWorldBounds(true);
        this.player.setGravityY(1600);
        this.physics.add.collider(this.player, this.ground);

        this.originalWidth = this.player.width;
        this.originalHeight = this.player.height;

        this.shieldGfx = this.add.graphics();
        this.shieldGfx.setVisible(false);

        this.obstacles = this.physics.add.group();
        this.coins = this.physics.add.group();
        this.hearts = this.physics.add.group();

        this.physics.add.overlap(this.player, this.obstacles, this.handleObstacleCollision, null, this);
        this.physics.add.overlap(this.player, this.coins, this.collectCoin, null, this);
        this.physics.add.overlap(this.player, this.hearts, this.collectHeart, null, this);

        this.spawnTimer = 0;
        this.spawnInterval = 2.0;

        this.createUI();
        this.createControls();

        this.input.on('pointerdown', () => {
            if (!this.scale.isFullscreen) {
                this.scale.startFullscreen();
            }
        });
    }

    createUI() {
        const width = this.cameras.main.width;
        
        // 체력바
        this.add.rectangle(140, 35, 204, 22, 0x000000, 0.5);
        this.hpBar = this.add.rectangle(40, 35, 200, 18, 0x22c55e).setOrigin(0, 0.5);

        // 스킬 코인 게이지바
        this.add.rectangle(140, 65, 204, 18, 0x000000, 0.5);
        this.skillBar = this.add.rectangle(40, 65, 0, 14, 0xeab308).setOrigin(0, 0.5);
        this.coinText = this.add.text(140, 65, 'COIN: 0/100', { fontSize: '12px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        // 점수 및 Phase UI
        this.scoreText = this.add.text(width - 40, 35, 'SCORE: 0', { fontSize: '22px', color: '#fff', fontStyle: 'bold' }).setOrigin(1, 0.5);
        this.phaseText = this.add.text(width / 2, 35, 'PHASE 1', { fontSize: '24px', color: '#facc15', fontStyle: 'bold' }).setOrigin(0.5);

        this.phaseUpText = this.add.text(width / 2, 180, 'PHASE UP!', { fontSize: '48px', color: '#facc15', fontStyle: 'bold' })
            .setOrigin(0.5).setAlpha(0);
    }

    createControls() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;
        const btnY = height - 60;

        const jumpBtn = this.add.circle(100, btnY, 48, 0x3b82f6, 0.6).setInteractive();
        this.add.text(100, btnY, 'JUMP', { fontSize: '18px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        jumpBtn.on('pointerdown', () => {
            this.handleJump();
        });

        const slideBtn = this.add.circle(width - 220, btnY, 48, 0x8b5cf6, 0.6).setInteractive();
        this.add.text(width - 220, btnY, 'SLIDE', { fontSize: '18px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        const startSlide = () => { this.setSliding(true); };
        const stopSlide = () => { this.setSliding(false); };

        slideBtn.on('pointerdown', startSlide);
        slideBtn.on('pointerup', stopSlide);
        slideBtn.on('pointerout', stopSlide);
        slideBtn.on('pointercancel', stopSlide);

        this.skillBtn = this.add.circle(width - 90, btnY, 48, 0x64748b, 0.6).setInteractive();
        this.skillBtnText = this.add.text(width - 90, btnY, 'SKILL', { fontSize: '18px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        this.skillBtn.on('pointerdown', () => {
            this.activateSkill();
        });
    }

    handleJump() {
        if (this.player.body.touching.down && !this.isSliding) {
            this.player.setVelocityY(-650);
            soundFx.playJump();
        }
    }

    setSliding(sliding) {
        if (this.isSliding === sliding) return;
        this.isSliding = sliding;

        if (sliding) {
            const newHeight = this.originalHeight * 0.45;
            this.player.body.setSize(this.originalWidth, newHeight);
            this.player.body.setOffset(0, this.originalHeight - newHeight);
            this.player.setScale(1.2, 0.45); // 납작하게 웅크리며 앞으로 길어짐
        } else {
            this.player.body.setSize(this.originalWidth, this.originalHeight);
            this.player.body.setOffset(0, 0);
            this.player.setScale(1, 1);
        }
    }

    activateSkill() {
        if (this.coinCount >= 100 && !this.isSkillActive) {
            this.isSkillActive = true;
            this.coinCount = 0;
            this.skillTimer = 6.0;
            soundFx.playSkill();

            if (this.skillType === 'DESTROY_RUSH') {
                this.obstacles.getChildren().forEach(obs => {
                    this.createExplosion(obs.x, obs.y);
                });
                this.obstacles.clear(true, true);
                this.cameras.main.shake(200, 0.01);
            }
        }
    }

    update(time, delta) {
        const dt = delta / 1000;

        this.phaseTime += dt;
        if (this.phaseTime >= 30) {
            this.phaseTime = 0;
            this.phase++;
            this.currentSpeed += 60;
            this.spawnInterval = Math.max(0.8, this.spawnInterval - 0.25);
            this.phaseText.setText(`PHASE ${this.phase}`);

            this.cameras.main.flash(300, 255, 255, 255);
            if (navigator.vibrate) navigator.vibrate(200);

            this.tweens.add({
                targets: this.phaseUpText,
                alpha: 1,
                scale: { from: 0.5, to: 1.2 },
                duration: 400,
                yoyo: true,
                hold: 600,
                onComplete: () => this.phaseUpText.setAlpha(0)
            });
        }

        if (this.isSkillActive) {
            this.skillTimer -= dt;
            if (this.skillTimer <= 0) {
                this.isSkillActive = false;
                this.shieldGfx.setVisible(false);
            } else {
                this.updateShieldEffect();
            }
        }

        if (this.isSkillActive && this.skillType === 'MAGNET_SHIELD') {
            this.coins.getChildren().forEach(coin => {
                const dist = Phaser.Math.Distance.Between(this.player.x, this.player.y - 35, coin.x, coin.y);
                if (dist < 380) {
                    this.physics.moveTo(coin, this.player.x, this.player.y - 35, 750);
                }
            });
        }

        this.spawnTimer += dt;
        if (this.spawnTimer >= this.spawnInterval) {
            this.spawnTimer = 0;
            this.spawnPattern();
        }

        const moveDistance = this.currentSpeed * dt;

        this.obstacles.getChildren().forEach(obs => {
            obs.x -= moveDistance;
            if (obs.x < -100) obs.destroy();
        });

        this.coins.getChildren().forEach(coin => {
            if (!this.isSkillActive || this.skillType !== 'MAGNET_SHIELD') {
                coin.x -= moveDistance;
            }
            if (coin.x < -50) coin.destroy();
        });

        this.hearts.getChildren().forEach(heart => {
            heart.x -= moveDistance;
            if (heart.x < -50) heart.destroy();
        });

        this.score += Math.floor(dt * 100);
        this.scoreText.setText(`SCORE: ${this.score}`);

        this.hpBar.width = Phaser.Math.Clamp((this.hp / this.maxHp) * 200, 0, 200);
        this.skillBar.width = Phaser.Math.Clamp((this.coinCount / 100) * 200, 0, 200);
        this.coinText.setText(`COIN: ${Math.floor(this.coinCount)}/100`);

        if (this.coinCount >= 100 && !this.isSkillActive) {
            this.skillBtn.setFillStyle(0xeab308, 1.0);
        } else {
            this.skillBtn.setFillStyle(0x64748b, 0.6);
        }
    }

    updateShieldEffect() {
        this.shieldGfx.clear();
        this.shieldGfx.setVisible(true);

        if (this.skillTimer <= 1.5 && Math.floor(this.time.now / 100) % 2 === 0) {
            return;
        }

        const color = (this.skillType === 'MAGNET_SHIELD') ? 0xc084fc : 0x4ade80;
        this.shieldGfx.lineStyle(4, color, 0.8);
        const centerY = this.player.y - (this.isSliding ? 20 : 45);
        this.shieldGfx.strokeCircle(this.player.x, centerY, 55);

        const angle = (this.time.now / 3) % 360;
        const rad = Phaser.Math.DegToRad(angle);
        const px = this.player.x + Math.cos(rad) * 55;
        const py = centerY + Math.sin(rad) * 55;

        this.shieldGfx.fillStyle(0xffffff, 1);
        this.shieldGfx.fillCircle(px, py, 6);
    }

    spawnPattern() {
        const width = this.cameras.main.width;
        const rand = Phaser.Math.Between(1, 3);

        if (rand === 1) {
            const obs = this.obstacles.create(width + 50, this.groundY - 32, 'obs_high');
            obs.body.allowGravity = false;
            obs.setImmovable(true);

            for(let i=0; i<3; i++) {
                const coin = this.coins.create(width + 50 + (i * 35), this.groundY - 120, 'item_coin');
                coin.body.allowGravity = false;
            }
        } else if (rand === 2) {
            const obs = this.obstacles.create(width + 50, this.groundY - 80, 'obs_air');
            obs.body.allowGravity = false;
            obs.setImmovable(true);

            for(let i=0; i<3; i++) {
                const coin = this.coins.create(width + 30 + (i * 35), this.groundY - 20, 'item_coin');
                coin.body.allowGravity = false;
            }
        } else {
            for(let i=0; i<4; i++) {
                const coin = this.coins.create(width + 50 + (i * 40), this.groundY - 30, 'item_coin');
                coin.body.allowGravity = false;
            }
            if (Phaser.Math.Between(1, 10) > 6) {
                const heart = this.hearts.create(width + 230, this.groundY - 80, 'item_heart');
                heart.body.allowGravity = false;
            }
        }
    }

    handleObstacleCollision(player, obstacle) {
        if (this.isSkillActive && this.skillType === 'DESTROY_RUSH') {
            this.createExplosion(obstacle.x, obstacle.y);
            obstacle.destroy();
            soundFx.playHit();
            return;
        }

        if (this.isSkillActive && this.skillType === 'MAGNET_SHIELD') {
            obstacle.destroy();
            soundFx.playHit();
            return;
        }

        obstacle.destroy();
        soundFx.playHit();
        this.hp -= 25;
        this.cameras.main.shake(150, 0.015);
        this.player.setTint(0xff0000);
        this.time.delayedCall(150, () => this.player.clearTint());

        if (this.hp <= 0) {
            this.gameOver();
        }
    }

    collectCoin(player, coin) {
        coin.destroy();
        soundFx.playCoin();
        this.score += 50;

        if (!this.isSkillActive) {
            this.coinCount = Math.min(100, this.coinCount + (1 * this.gaugeMultiplier));
        }
    }

    collectHeart(player, heart) {
        heart.destroy();
        soundFx.playCoin();
        this.hp = Math.min(this.maxHp, this.hp + 30);
    }

    createExplosion(x, y) {
        const emitter = this.add.particles(x, y, 'item_coin', {
            speed: { min: -200, max: 200 },
            angle: { min: 0, max: 360 },
            scale: { start: 0.5, end: 0 },
            blendMode: 'ADD',
            lifespan: 300,
            gravityY: 0
        });
        this.time.delayedCall(300, () => emitter.destroy());
    }

    gameOver() {
        soundFx.stopBGM();
        this.scene.start('GameOverScene', { score: this.score });
    }
}

/**
 * Character Select Scene
 */
class CharSelectScene extends Phaser.Scene {
    constructor() {
        super({ key: 'CharSelectScene' });
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        this.add.text(width / 2, 50, '건스패밀리', { fontSize: '42px', color: '#facc15', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2, 95, '히어로를 선택하세요', { fontSize: '18px', color: '#94a3b8' }).setOrigin(0.5);

        // 건영 카드
        const card1 = this.add.rectangle(width / 2 - 140, height / 2 + 20, 230, 310, 0x1e293b).setStrokeStyle(3, 0xc084fc).setInteractive();
        this.add.image(width / 2 - 140, height / 2 - 40, 'char_gunyoung');
        this.add.text(width / 2 - 140, height / 2 + 35, '건영 (블랙팬서)', { fontSize: '20px', color: '#c084fc', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2 - 140, height / 2 + 90, 'HP: 100\n코인 ~67개면 스킬 가능!\n(게이지 1.5배 효율)', { fontSize: '14px', color: '#cbd5e1', align: 'center', lineHeight: 1.4 }).setOrigin(0.5);

        // 건우 카드
        const card2 = this.add.rectangle(width / 2 + 140, height / 2 + 20, 230, 310, 0x1e293b).setStrokeStyle(3, 0x4ade80).setInteractive();
        this.add.image(width / 2 + 140, height / 2 - 40, 'char_gunwoo');
        this.add.text(width / 2 + 140, height / 2 + 35, '건우 (헐크)', { fontSize: '20px', color: '#4ade80', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2 + 140, height / 2 + 90, 'HP: 150\n코인 100개 필요\n(장애물 전멸+무적 돌진)', { fontSize: '14px', color: '#cbd5e1', align: 'center', lineHeight: 1.4 }).setOrigin(0.5);

        card1.on('pointerdown', () => {
            soundFx.init();
            this.scene.start('MainGameScene', { character: 'gunyoung' });
        });

        card2.on('pointerdown', () => {
            soundFx.init();
            this.scene.start('MainGameScene', { character: 'gunwoo' });
        });
    }
}

/**
 * Game Over Scene
 */
class GameOverScene extends Phaser.Scene {
    constructor() {
        super({ key: 'GameOverScene' });
    }

    init(data) {
        this.finalScore = data.score || 0;
    }

    create() {
        const width = this.cameras.main.width;
        const height = this.cameras.main.height;

        this.add.text(width / 2, height / 2 - 80, 'GAME OVER', { fontSize: '48px', color: '#ef4444', fontStyle: 'bold' }).setOrigin(0.5);
        this.add.text(width / 2, height / 2, `FINAL SCORE: ${this.finalScore}`, { fontSize: '28px', color: '#fff' }).setOrigin(0.5);

        const restartBtn = this.add.rectangle(width / 2, height / 2 + 90, 200, 50, 0x3b82f6).setInteractive();
        this.add.text(width / 2, height / 2 + 90, '다시 하기', { fontSize: '22px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);

        restartBtn.on('pointerdown', () => {
            this.scene.start('CharSelectScene');
        });
    }
}

const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    width: 960,
    height: 540,
    scale: {
        mode: Phaser.Scale.FIT,
        autoCenter: Phaser.Scale.CENTER_BOTH
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 0 },
            debug: false
        }
    },
    scene: [CharSelectScene, MainGameScene, GameOverScene]
};

const game = new Phaser.Game(config);
</script>
