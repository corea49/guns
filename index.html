<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>건스패밀리</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f0c20;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
        }
        #game-container {
            width: 100%;
            height: 100%;
        }
        canvas {
            display: block;
        }
    </style>
    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
</head>
<body>

<div id="game-container"></div>

<script>
/**
 * 건스패밀리 (Guns Family) - 쿠키런 스타일 런닝 게임
 * 갤럭시 S25 울트라 및 모바일 크롬 최적화
 */

// 1. Phaser 게임 기본 설정
const config = {
    type: Phaser.AUTO,
    parent: 'game-container',
    scale: {
        mode: Phaser.Scale.RESIZE,
        autoCenter: Phaser.Scale.CENTER_BOTH,
        width: 1280,
        height: 720
    },
    physics: {
        default: 'arcade',
        arcade: {
            gravity: { y: 1400 }, // 통통 튀는 중력감
            debug: false
        }
    },
    scene: {
        preload: preload,
        create: create,
        update: update
    }
};

const game = new Phaser.Game(config);

// 전역 변수
let selectedHero = null; // 'GUNWOO' 또는 'GUNYOUNG'
let player;
let ground;
let obstacles;
let coins;
let particleEmitter;

// 게임 상태 변수
let score = 0;
let coinCount = 0;
let playerHP = 100;
let isGameRunning = false;
let gameSpeed = 6;
let jumpCount = 0;
let isSliding = false;
let skillGauge = 0;
let isFever = false;

// 모바일 터치 UI
let jumpBtn, slideBtn, skillBtn;
let uiText, scoreText, hpBarBg, hpBarFill, skillBarFill;
let selectScreenContainer;

function preload() {
    // 도형으로 텍스처 자체 생성
}

function create() {
    const scene = this;

    // --- 도형 기반 독자적 텍스처 동적 제작 ---
    createBlockTextures(scene);

    // 배경 스크롤 처리용 타일
    scene.bgFar = scene.add.tileSprite(0, 0, scene.scale.width, scene.scale.height, 'bgLayer').setOrigin(0, 0);

    // 물리 바닥 생성
    ground = scene.physics.add.staticGroup();
    let groundY = scene.scale.height - 80;
    scene.groundTile = scene.add.tileSprite(0, groundY, scene.scale.width * 2, 160, 'groundBlock').setOrigin(0, 0);
    scene.physics.add.existing(scene.groundTile, true);

    // 그룹 생성
    obstacles = scene.physics.add.group();
    coins = scene.physics.add.group();

    // 터치 UI 생성
    createInGameUI(scene);

    // 캐릭터 선택 화면 생성
    createCharacterSelectScreen(scene);

    // PC 키보드 지원
    scene.cursors = scene.input.keyboard.createCursorKeys();
    scene.spaceKey = scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SPACE);
    scene.shiftKey = scene.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.SHIFT);

    // 스폰 타이머 (1.5초마다 장애물/동전 생성)
    scene.time.addEvent({
        delay: 1500,
        callback: () => { if (isGameRunning) spawnPattern(scene); },
        loop: true
    });

    // 화면 크기 변경 시 UI 자동 대응
    scene.scale.on('resize', (gameSize) => {
        scene.bgFar.setSize(gameSize.width, gameSize.height);
        repositionUI(scene, gameSize);
    });
}

function update() {
    if (!isGameRunning) return;

    // 배경 및 바닥 스크롤
    let currentSpeed = isFever ? gameSpeed * 1.5 : gameSpeed;
    this.bgFar.tilePositionX += currentSpeed * 0.3;
    this.groundTile.tilePositionX += currentSpeed;

    // 체력 감소
    playerHP -= 0.05;
    if (playerHP <= 0) {
        gameOver(this);
    }
    updateUI();

    // 장애물 & 동전 이동 및 화면 밖 삭제
    obstacles.children.iterate((obs) => {
        if (obs) {
            obs.x -= currentSpeed;
            if (obs.x < -100) obs.destroy();
        }
    });

    coins.children.iterate((coin) => {
        if (coin) {
            coin.x -= currentSpeed;

            // 건영(블랙팬서) 스킬: 코인 자석
            if (selectedHero === 'GUNYOUNG' && skillGauge >= 100 && isFever) {
                this.physics.moveToObject(coin, player, 400);
            }

            if (coin.x < -50) coin.destroy();
        }
    });

    // PC 키보드 입력을 위한 연동
    if (Phaser.Input.Keyboard.JustDown(this.cursors.up) || Phaser.Input.Keyboard.JustDown(this.spaceKey)) {
        handleJump(this);
    }
    if (this.cursors.down.isDown) {
        handleSlide(this, true);
    } else if (isSliding && !this.cursors.down.isDown) {
        handleSlide(this, false);
    }
}

// --- 텍스처 생성 (블랙팬서 건영 / 헐크 건우) ---
function createBlockTextures(scene) {
    const g = scene.make.graphics({ x: 0, y: 0, add: false });

    // 배경
    g.fillStyle(0x1a1c2e);
    g.fillRect(0, 0, 64, 64);
    g.fillStyle(0x2d3142);
    g.fillCircle(32, 32, 4);
    g.generateTexture('bgLayer', 64, 64);

    // 바닥
    g.clear();
    g.fillStyle(0x34495e);
    g.fillRect(0, 0, 64, 64);
    g.fillStyle(0x2c3e50);
    g.fillRect(0, 0, 64, 8);
    g.generateTexture('groundBlock', 64, 64);

    // 건영 (블랙팬서 스타일: 보라/검정 텍스처)
    g.clear();
    g.fillStyle(0x2c2c54); // 슈트
    g.fillRect(8, 8, 32, 48);
    g.fillStyle(0xa55eea); // 보라색 광원 라인
    g.fillRect(12, 12, 24, 6);
    g.fillStyle(0x00d2d3); // 마스크 예리한 눈
    g.fillRect(14, 20, 6, 4);
    g.fillRect(28, 20, 6, 4);
    g.generateTexture('heroGunyoung', 48, 64);

    // 건우 (헐크 스타일: 강렬한 초록/보라 텍스처)
    g.clear();
    g.fillStyle(0x26de81); // 피부
    g.fillRect(4, 4, 40, 56);
    g.fillStyle(0x8854d0); // 보라 바지
    g.fillRect(4, 40, 40, 20);
    g.fillStyle(0xff4757); // 사나운 눈
    g.fillRect(10, 16, 8, 6);
    g.fillRect(30, 16, 8, 6);
    g.generateTexture('heroGunwoo', 48, 64);

    // 장애물 (빨간 레이저 블록)
    g.clear();
    g.fillStyle(0xeb4d4b);
    g.fillRect(0, 0, 40, 60);
    g.fillStyle(0xffbe76);
    g.fillRect(5, 5, 30, 10);
    g.generateTexture('obstacleHigh', 40, 60);

    // 동전 (골드 코인)
    g.clear();
    g.fillStyle(0xf1c40f);
    g.fillCircle(16, 16, 16);
    g.fillStyle(0xf39c12);
    g.fillCircle(16, 16, 10);
    g.generateTexture('coinBlock', 32, 32);
}

// --- 캐릭터 선택 화면 ---
function createCharacterSelectScreen(scene) {
    selectScreenContainer = scene.add.container(0, 0).setDepth(100);

    let bgOverlay = scene.add.rectangle(scene.scale.width / 2, scene.scale.height / 2, scene.scale.width, scene.scale.height, 0x000000, 0.85);
    let titleText = scene.add.text(scene.scale.width / 2, 100, '⚡ 건스패밀리 ⚡', {
        fontSize: '42px', color: '#f1c40f', style: 'bold'
    }).setOrigin(0.5);

    let subText = scene.add.text(scene.scale.width / 2, 160, '플레이할 캐릭터를 선택하세요!', {
        fontSize: '22px', color: '#ffffff'
    }).setOrigin(0.5);

    // 1. 건영 카드 (블랙팬서)
    let card1 = scene.add.rectangle(scene.scale.width / 2 - 180, scene.scale.height / 2 + 30, 260, 320, 0x2c2c54, 0.9).setInteractive();
    card1.setStrokeStyle(4, 0xa55eea);
    let img1 = scene.add.image(scene.scale.width / 2 - 180, scene.scale.height / 2 - 40, 'heroGunyoung').setScale(1.8);
    let name1 = scene.add.text(scene.scale.width / 2 - 180, scene.scale.height / 2 + 40, '건영\n(블랙팬서)', {
        fontSize: '26px', color: '#a55eea', style: 'bold', align: 'center'
    }).setOrigin(0.5);
    let desc1 = scene.add.text(scene.scale.width / 2 - 180, scene.scale.height / 2 + 110, '속도가 빠르고\n자석 스킬 발동!', {
        fontSize: '16px', color: '#cccccc', align: 'center'
    }).setOrigin(0.5);

    card1.on('pointerdown', () => selectHero(scene, 'GUNYOUNG'));

    // 2. 건우 카드 (헐크)
    let card2 = scene.add.rectangle(scene.scale.width / 2 + 180, scene.scale.height / 2 + 30, 260, 320, 0x20bf6b, 0.2).setInteractive();
    card2.setStrokeStyle(4, 0x26de81);
    let img2 = scene.add.image(scene.scale.width / 2 + 180, scene.scale.height / 2 - 40, 'heroGunwoo').setScale(1.8);
    let name2 = scene.add.text(scene.scale.width / 2 + 180, scene.scale.height / 2 + 40, '건우\n(헐크)', {
        fontSize: '26px', color: '#26de81', style: 'bold', align: 'center'
    }).setOrigin(0.5);
    let desc2 = scene.add.text(scene.scale.width / 2 + 180, scene.scale.height / 2 + 110, '체력이 높고\n장애물 파괴 스킬!', {
        fontSize: '16px', color: '#cccccc', align: 'center'
    }).setOrigin(0.5);

    card2.on('pointerdown', () => selectHero(scene, 'GUNWOO'));

    selectScreenContainer.add([bgOverlay, titleText, subText, card1, img1, name1, desc1, card2, img2, name2, desc2]);
}

function selectHero(scene, heroType) {
    selectedHero = heroType;
    selectScreenContainer.setVisible(false);

    // 플레이어 생성
    let texture = (heroType === 'GUNYOUNG') ? 'heroGunyoung' : 'heroGunwoo';
    let startY = scene.scale.height - 150;
    player = scene.physics.add.sprite(150, startY, texture);
    player.setCollideWorldBounds(true);
    player.setBounce(0.0);

    // 바닥 충돌
    scene.physics.add.collider(player, scene.groundTile, () => {
        jumpCount = 0; // 착지 시 점프 초기화
    });

    // 충돌 처리 (장애물, 동전)
    scene.physics.add.overlap(player, obstacles, hitObstacle, null, scene);
    scene.physics.add.overlap(player, coins, collectCoin, null, scene);

    // 능력이 다른 초기설정
    if (selectedHero === 'GUNWOO') {
        playerHP = 130; // 건우는 체력이 더 많음
    } else {
        playerHP = 100;
    }

    isGameRunning = true;
}

// --- 인게임 터치 UI 조작계 ---
function createInGameUI(scene) {
    let w = scene.scale.width;
    let h = scene.scale.height;

    // 상단 HP 및 스킬 바
    hpBarBg = scene.add.rectangle(140, 30, 200, 20, 0x555555).setDepth(50);
    hpBarFill = scene.add.rectangle(40, 30, 200, 20, 0x2ecc71).setOrigin(0, 0.5).setDepth(50);
    
    scoreText = scene.add.text(w - 30, 25, '점수: 0  |  🪙 0', {
        fontSize: '22px', color: '#f1c40f', style: 'bold'
    }).setOrigin(1, 0.5).setDepth(50);

    // 터치 버튼 (하단 구석 배치)
    jumpBtn = scene.add.circle(90, h - 90, 55, 0x3498db, 0.7).setInteractive().setDepth(50);
    scene.add.text(90, h - 90, '점프', { fontSize: '22px', color: '#fff', style: 'bold' }).setOrigin(0.5).setDepth(51);

    slideBtn = scene.add.circle(220, h - 75, 45, 0xe67e22, 0.7).setInteractive().setDepth(50);
    scene.add.text(220, h - 75, '슬라이딩', { fontSize: '18px', color: '#fff' }).setOrigin(0.5).setDepth(51);

    skillBtn = scene.add.circle(w - 90, h - 90, 55, 0x9b59b6, 0.7).setInteractive().setDepth(50);
    scene.add.text(w - 90, h - 90, '스킬!', { fontSize: '22px', color: '#fff', style: 'bold' }).setOrigin(0.5).setDepth(51);

    // 버튼 터치 이벤트
    jumpBtn.on('pointerdown', () => handleJump(scene));
    
    slideBtn.on('pointerdown', () => handleSlide(scene, true));
    slideBtn.on('pointerup', () => handleSlide(scene, false));
    slideBtn.on('pointerout', () => handleSlide(scene, false));

    skillBtn.on('pointerdown', () => useHeroSkill(scene));
}

// 점프 로직 (2단 점프)
function handleJump(scene) {
    if (!isGameRunning || isSliding) return;

    if (jumpCount < 2) {
        let jumpVelocity = (selectedHero === 'GUNYOUNG') ? -620 : -580;
        player.setVelocityY(jumpVelocity);
        jumpCount++;
    }
}

// 슬라이딩 로직
function handleSlide(scene, startSlide) {
    if (!isGameRunning) return;

    if (startSlide && !isSliding) {
        isSliding = true;
        player.setScale(1.0, 0.5); // 몸집을 납작하게 축소
        player.body.offset.y = 32;
    } else if (!startSlide && isSliding) {
        isSliding = false;
        player.setScale(1.0, 1.0);
        player.body.offset.y = 0;
    }
}

// 고유 스킬 발동
function useHeroSkill(scene) {
    if (skillGauge < 100 || !isGameRunning) return;

    skillGauge = 0;
    isFever = true;

    if (selectedHero === 'GUNWOO') {
        // 헐크: 화면 내 모든 장애물 즉시 파괴!
        scene.cameras.main.shake(300, 0.02);
        obstacles.children.iterate((obs) => {
            if (obs) obs.destroy();
        });
    } else {
        // 블랙팬서: 부스터 속도 업 + 코인 끌어당김
        scene.cameras.main.flash(300, 165, 94, 234);
    }

    // 5초 후 스킬 종료
    scene.time.delayedCall(5000, () => {
        isFever = false;
    });
}

// --- 장애물 & 동전 스폰 패턴 ---
function spawnPattern(scene) {
    let groundY = scene.scale.height - 80;

    // 장애물 스폰
    let obsType = Phaser.Math.Between(0, 2);
    if (obsType === 0) {
        // 바닥 장애물 (점프 필요)
        let obs = obstacles.create(scene.scale.width + 50, groundY - 30, 'obstacleHigh');
        obs.body.allowGravity = false;
        obs.setImmovable(true);
    } else if (obsType === 1) {
        // 공중 장애물 (슬라이딩 필요)
        let obs = obstacles.create(scene.scale.width + 50, groundY - 80, 'obstacleHigh');
        obs.body.allowGravity = false;
        obs.setImmovable(true);
    }

    // 동전 라인 스폰
    for (let i = 0; i < 5; i++) {
        let coin = coins.create(scene.scale.width + 100 + (i * 40), groundY - 120, 'coinBlock');
        coin.body.allowGravity = false;
    }
}

// --- 충돌 판정 ---
function hitObstacle(p, obs) {
    if (isFever && selectedHero === 'GUNWOO') {
        // 헐크 스킬 상태에서는 장애물을 그냥 부숨
        obs.destroy();
        score += 500;
        return;
    }

    obs.destroy();
    playerHP -= 20;
    this.cameras.main.shake(150, 0.01);
    
    if (navigator.vibrate) navigator.vibrate(100); // 폰 진동
    if (playerHP <= 0) gameOver(this);
}

function collectCoin(p, coin) {
    coin.destroy();
    score += 100;
    coinCount++;
    
    // 스킬 게이지 충전
    if (skillGauge < 100) {
        skillGauge += 5;
    }
}

function updateUI() {
    scoreText.setText(`점수: ${score}  |  🪙 ${coinCount}`);
    
    // HP 바 업데이트
    let hpPercent = Math.max(0, playerHP / (selectedHero === 'GUNWOO' ? 130 : 100));
    hpBarFill.width = 200 * hpPercent;

    // 스킬 버튼 투명도 조절 (게이지 100% 시 밝아짐)
    if (skillBtn) {
        skillBtn.setAlpha(skillGauge >= 100 ? 1.0 : 0.4);
    }
}

function gameOver(scene) {
    isGameRunning = false;
    scene.physics.pause();

    let gameOverText = scene.add.text(scene.scale.width / 2, scene.scale.height / 2 - 40, 'GAME OVER', {
        fontSize: '52px', color: '#e74c3c', style: 'bold'
    }).setOrigin(0.5).setDepth(100);

    let resultText = scene.add.text(scene.scale.width / 2, scene.scale.height / 2 + 30, `최종 점수: ${score}\n획득 코인: 🪙 ${coinCount}\n\n[화면을 터치하여 다시 시작]`, {
        fontSize: '24px', color: '#ffffff', align: 'center'
    }).setOrigin(0.5).setDepth(100);

    scene.input.once('pointerdown', () => {
        score = 0;
        coinCount = 0;
        skillGauge = 0;
        isFever = false;
        scene.scene.restart();
    });
}

function repositionUI(scene, gameSize) {
    let w = gameSize.width;
    let h = gameSize.height;

    if (jumpBtn) jumpBtn.setPosition(90, h - 90);
    if (slideBtn) slideBtn.setPosition(220, h - 75);
    if (skillBtn) skillBtn.setPosition(w - 90, h - 90);
    if (scoreText) scoreText.setPosition(w - 30, 25);
}
</script>
</body>
</html>
